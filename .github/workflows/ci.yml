name: Validate Factory plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate.py
      - run: python3 scripts/test_fly_guard.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/sync_shared.py --check
      - run: git diff --exit-code
