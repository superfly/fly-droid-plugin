name: Sync shared skills
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-shared-skills
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync upstream main without downgrading a review pin
        run: |
          git clone --quiet https://github.com/superfly/skills.git "$RUNNER_TEMP/fly-shared-skills"
          pin=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["commit"])')
          git -C "$RUNNER_TEMP/fly-shared-skills" fetch --quiet origin "$pin"
          if ! git -C "$RUNNER_TEMP/fly-shared-skills" merge-base --is-ancestor "$pin" origin/main; then
            echo 'Current pin is not on upstream main; merge/re-pin the reviewed upstream changes first.'
            exit 1
          fi
          python3 scripts/sync_shared.py --source "$RUNNER_TEMP/fly-shared-skills" --ref origin/main
          python3 scripts/validate.py
          python3 scripts/test_fly_guard.py
          python3 -m unittest discover -s tests -v
      - name: Propose a reviewed update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          pin=$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["commit"])')
          branch="automation/skills-${pin:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "An update branch already exists: $branch"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream.lock.json plugins/fly/skills plugins/fly/hooks plugins/fly/scripts plugins/fly/assets plugins/fly/LICENSE scripts/test_fly_guard.py LICENSE
          git commit -m "Sync shared Fly skills to ${pin:0:12}"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/sync-pr-body.md" <<'BODY'
          Updates the shared skills and confirmation guard to the pinned upstream main commit recorded in upstream.lock.json. Native Factory packaging remains maintained here.

          Validation: package checks, upstream guard tests, and sync regression tests passed. Review the shared diff, bump the Factory plugin version before release, and run a live Droid smoke test.

          Generated by the synchronization workflow authored by Codex.
          BODY
          gh pr create --title 'Sync shared Fly skills' --body-file "$RUNNER_TEMP/sync-pr-body.md" --head "$branch"
